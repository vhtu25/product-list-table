<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #0056b3;
            color: #ffffff;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f7ff;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop ASUS Vivobook</td>
                <td>15.490.000 đ</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech</td>
                <td>350.000 đ</td>
                <td>45</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Gaming</td>
                <td>1.250.000 đ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Màn hình Dell UltraSharp</td>
                <td>6.800.000 đ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
